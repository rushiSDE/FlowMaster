name: kyc-workflow
version: "1.0"
steps:
  - name: verification
    service: verification
    event: verification.started
    timeoutMs: 5000
    retries: 2
    compensation:
      service: verification
      event: verification.compensate
  - name: credit-check
    service: credit
    event: credit.started
    timeoutMs: 5000
    retries: 2
    compensation:
      service: credit
      event: credit.compensate
  - name: approval
    service: orchestrator
    event: approval.finalized
    timeoutMs: 4000
    retries: 1
